<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnos Inspectores</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #637083;
      --line: #d8dee8;
      --panel: #ffffff;
      --page: #f4f7fb;
      --blue: #155e9f;
      --green: #087f5b;
      --amber: #b7791f;
      --red: #b42318;
      --soft-blue: #e8f1fb;
      --soft-green: #e7f6ef;
      --soft-amber: #fff4dc;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      padding: 18px clamp(16px, 4vw, 36px);
    }
    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }
    .clock {
      min-width: 230px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: var(--soft-blue);
      text-align: right;
    }
    .clock strong {
      display: block;
      font-size: 24px;
      line-height: 1.15;
    }
    .clock span { color: var(--muted); font-size: 13px; }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px clamp(16px, 4vw, 36px) 32px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
      align-items: end;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    select, input, button {
      height: 40px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      padding: 0 10px;
      font: inherit;
    }
    button {
      cursor: pointer;
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
      font-weight: 700;
    }
    .status {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 14px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .metric strong {
      display: block;
      margin-top: 5px;
      font-size: 22px;
      line-height: 1.15;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin: 18px 0 10px;
    }
    .section-title h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }
    .section-title span {
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      padding: 14px;
      min-height: 150px;
      display: grid;
      gap: 9px;
      align-content: start;
    }
    .card.bt-sp { border-left-color: var(--green); }
    .card.bt-ap { border-left-color: var(--amber); }
    .card.nte-chico { border-left-color: var(--red); }
    .card .area {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .card h3 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .details {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    .phone {
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      width: fit-content;
      padding: 2px 8px;
      border: 1px solid var(--line);
      background: var(--soft-green);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }
    .empty {
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 18px;
      color: var(--muted);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid var(--line);
      font-size: 13px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #eef3f8;
      color: #344054;
      font-size: 12px;
      text-transform: uppercase;
    }
    .source {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 760px) {
      .topbar, .controls, .status { grid-template-columns: 1fr; }
      .clock { text-align: left; min-width: 0; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>

  <header>

        <div class="subtitle">BT, MT y NTE CHICO con actualizacion por hora del equipo.</div>

          <option value="16:00-24:00">16:00-00:00</option>
          <option value="todos">Todos</option>
        </select>
      </label>
      <button id="nowButton" type="button">Usar ahora</button>
    </section>

    <section class="status">

    </div>
    <section id="dayTable"></section>

  </main>

:"2026-08-02","dia":"DO","area":"MT","grupo":"","horario":"16:00-24:00","inspector":"LEONARDO MONTOYA","celular":"985588913","codigo":"COL","hoja":"INSPECTOR MT - JULIO_2026","celda":"BA85","inicio":960,"fin":1440},{"fecha":"2026-08-02","dia":"DO","area":"NTE CHICO","grupo":"EA","horario":"00:00-08:00","inspector":"Arone Allcca Ebert","celular":"920529448","codigo":"EA","hoja":"NTE CHICO - JULIO 26","celda":"AR19","inicio":0,"fin":480},{"fecha":"2026-08-02","dia":"DO","area":"NTE CHICO","grupo":"OR","horario":"08:00-16:00","inspector":"Omar Romero Pacheco","celular":"985567231","codigo":"OR","hoja":"NTE CHICO - JULIO 26","celda":"AR30","inicio":480,"fin":960},{"fecha":"2026-08-02","dia":"DO","area":"NTE CHICO","grupo":"LM","horario":"16:00-24:00","inspector":"ponte goicochea schneider antony","celular":"948842260","codigo":"SP","hoja":"NTE CHICO - JULIO 26","celda":"AR41","inicio":960,"fin":1440}];
    const areaFilter = document.getElementById("areaFilter");
    const dateInput = document.getElementById("dateInput");
    const timeInput = document.getElementById("timeInput");
    const shiftFilter = document.getElementById("shiftFilter");
    const nowButton = document.getElementById("nowButton");
    const activeGrid = document.getElementById("activeGrid");
    const dayTable = document.getElementById("dayTable");
    const activeCount = document.getElementById("activeCount");
    const shiftLabel = document.getElementById("shiftLabel");
    const activeCaption = document.getElementById("activeCaption");
    const dayCaption = document.getElementById("dayCaption");
    const clockTime = document.getElementById("clockTime");
    const clockDate = document.getElementById("clockDate");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function localDate(now) {
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    function localTime(now) {
      return `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    }

    function timeToMinutes(value) {
      const [hours, minutes] = value.split(":").map(Number);
      return hours * 60 + minutes;
    }

    function detectShift(minutes) {
      if (minutes < 480) return "00:00-08:00";
      if (minutes < 960) return "08:00-16:00";
      if (minutes < 1065) return "16:00-24:00 (BT-AP sigue 08:00-17:45)";
      return "16:00-24:00";
    }

    function shiftBucket(row) {
      if (row.horario === "00:00-08:00") return "00:00-08:00";
      if (row.horario === "08:00-16:00" || row.horario === "08:00-17:45") return "08:00-16:00";
      if (row.horario === "16:00-24:00") return "16:00-24:00";
      return row.horario;
    }

    function areaClass(area) {
      return area.toLowerCase().replace(/\s+/g, "-");
    }

    function applyNow() {
      const now = new Date();
      dateInput.value = localDate(now);
      timeInput.value = localTime(now);
      shiftFilter.value = "actual";
      render();
    }

    function updateClock() {
      const now = new Date();
      clockTime.textContent = now.toLocaleTimeString("es-PE", { hour: "2-digit", minute: "2-digit" });
      clockDate.textContent = now.toLocaleDateString("es-PE", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    }

    function inArea(row) {
      return areaFilter.value === "Todas" || row.area === areaFilter.value;
    }

    function selectedRows() {
      const selectedDate = dateInput.value;
      const minutes = timeToMinutes(timeInput.value);
      const selectedShift = shiftFilter.value;
      return TURNOS.filter((row) =>
        row.fecha === selectedDate &&
        inArea(row) &&
        (
          selectedShift === "todos" ||
          (selectedShift === "actual" && row.inicio !== null && row.fin !== null && row.inicio <= minutes && row.fin > minutes) ||
          (selectedShift !== "actual" && selectedShift !== "todos" && shiftBucket(row) === selectedShift)
        )
      ).sort((a, b) => `${a.area} ${a.horario} ${a.inspector}`.localeCompare(`${b.area} ${b.horario} ${b.inspector}`));
    }

    function dayRows() {
      const selectedDate = dateInput.value;
      return TURNOS.filter((row) => row.fecha === selectedDate && inArea(row))
        .sort((a, b) => a.inicio - b.inicio || a.area.localeCompare(b.area) || a.inspector.localeCompare(b.inspector));
    }

    function card(row) {
      const phone = row.celular ? `<a class="phone" href="tel:${row.celular.replace(/\s+/g, "")}">${row.celular}</a>` : "";
      const group = row.grupo ? `<div>Grupo: ${row.grupo}</div>` : "";
      const tag = shiftFilter.value === "actual" ? "Activo" : "Seleccionado";
      return `<article class="card ${areaClass(row.area)}">
        <div class="area"><span>${row.area}</span><span>${row.codigo}</span></div>
        <h3>${row.inspector}</h3>
        <div class="details">
          <div>Horario: ${row.horario}</div>
          ${group}
          <div>Celular: ${phone}</div>
          <div>Origen: ${row.hoja} ${row.celda}</div>
        </div>
        <span class="tag">${tag}</span>
      </article>`;
    }

    function renderCards(rows) {
      if (!rows.length) {
        activeGrid.innerHTML = `<div class="empty">Sin turno activo para el filtro seleccionado.</div>`;
        return;
      }
      activeGrid.innerHTML = rows.map(card).join("");
    }

    function renderTable(rows) {
      if (!rows.length) {
        dayTable.innerHTML = `<div class="empty">Sin registros para esa fecha y area.</div>`;
        return;
      }
      const body = rows.map((row) => `<tr>
        <td>${row.horario}</td>
        <td>${row.area}</td>
        <td>${row.grupo || ""}</td>
        <td>${row.inspector}</td>
        <td>${row.celular}</td>
        <td>${row.codigo}</td>
      </tr>`).join("");
      dayTable.innerHTML = `<table>
        <thead><tr><th>Horario</th><th>Area</th><th>Grupo</th><th>Inspector</th><th>Celular</th><th>Codigo</th></tr></thead>
        <tbody>${body}</tbody>
      </table>`;
    }

    function render() {
      if (!dateInput.value || !timeInput.value) {
        const now = new Date();
        if (!dateInput.value) dateInput.value = localDate(now);
        if (!timeInput.value) timeInput.value = localTime(now);
      }
      const minutes = timeToMinutes(timeInput.value);
      const active = selectedRows();
      const allDay = dayRows();
      shiftLabel.textContent = shiftFilter.value === "actual" ? detectShift(minutes) : shiftFilter.options[shiftFilter.selectedIndex].text;
      activeCount.textContent = active.length;
      activeCaption.textContent = `${dateInput.value} · ${shiftLabel.textContent} · ${areaFilter.value}`;
      dayCaption.textContent = `${allDay.length} registros`;
      renderCards(active);
      renderTable(allDay);
    }

    areaFilter.addEventListener("change", render);
    dateInput.addEventListener("change", render);
    timeInput.addEventListener("change", render);
    shiftFilter.addEventListener("change", render);
    nowButton.addEventListener("click", applyNow);

    applyNow();
    updateClock();
    setInterval(updateClock, 30000);
  </script>
